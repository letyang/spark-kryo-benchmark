# reproduce.yml - GitHub Actions CI/CD Pipeline for Reproducibility Testing
# This workflow automatically validates and tests the reproduction package
# It runs on every push, pull request, and weekly schedule

name: Reproducibility CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # Job 1: Validate configuration files
  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Validate JSON configuration files
        run: |
          echo "Validating JSON configuration files..."
          for file in configs/*.json; do
            echo "  Checking: $file"
            python3 -c "import json; json.load(open('$file'))"
            if [ $? -eq 0 ]; then
              echo "    ✓ Valid JSON"
            else
              echo "    ✗ Invalid JSON"
              exit 1
            fi
          done
          echo "All JSON files are valid!"
      
      - name: Validate YAML files (syntax only - NO AWS)
        run: |
          echo "Validating YAML files..."
          pip install pyyaml
          for file in cloudformation/*.yaml; do
            if [ -f "$file" ]; then
              python3 -c "import yaml; yaml.safe_load(open('$file'))"
              echo "    ✓ $file is valid YAML"
            fi
          done
          for file in monitoring/conf/*.yaml; do
            if [ -f "$file" ]; then
              python3 -c "import yaml; yaml.safe_load(open('$file'))"
              echo "    ✓ $file is valid YAML"
            fi
          done
      
      - name: Check Dockerfile exists
        run: |
          if [ -f "docker/Dockerfile" ]; then
            echo "✓ Dockerfile exists"
          else
            echo "✗ Dockerfile not found"
            exit 1
          fi

  # Job 2: Validate Python and Shell scripts
  validate-scripts:
    name: Validate Script Syntax
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check Python syntax
        run: |
          echo "Checking Python scripts..."
          for file in scripts/*.py; do
            python3 -m py_compile "$file"
            echo "  ✓ $file syntax OK"
          done
      
      - name: Check shell script syntax
        run: |
          echo "Checking shell scripts..."
          for file in scripts/*.sh cloudformation/*.sh; do
            if [ -f "$file" ]; then
              bash -n "$file"
              echo "  ✓ $file syntax OK"
            fi
          done

  # Job 3: Check file completeness
  check-files:
    name: Check File Completeness
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check required files exist
        run: |
          echo "Checking required files..."
          MISSING=0
          
          # Root files
          [ -f ".gitignore" ] && echo "  ✓ .gitignore" || { echo "  ✗ .gitignore missing"; MISSING=1; }
          [ -f "LICENSE" ] && echo "  ✓ LICENSE" || { echo "  ✗ LICENSE missing"; MISSING=1; }
          [ -f "README.md" ] && echo "  ✓ README.md" || { echo "  ✗ README.md missing"; MISSING=1; }
          
          # Config files
          for file in configs/*.json; do
            [ -f "$file" ] && echo "  ✓ $file" || { echo "  ✗ $file missing"; MISSING=1; }
          done
          
          # Script files
          for file in scripts/*.sh; do
            [ -f "$file" ] && echo "  ✓ $file" || { echo "  ✗ $file missing"; MISSING=1; }
          done
          
          for file in scripts/*.py; do
            [ -f "$file" ] && echo "  ✓ $file" || { echo "  ✗ $file missing"; MISSING=1; }
          done
          
          # R files
          for file in stats/*.R; do
            [ -f "$file" ] && echo "  ✓ $file" || { echo "  ✗ $file missing"; MISSING=1; }
          done
          
          # Results files
          for file in results/*.csv; do
            [ -f "$file" ] && echo "  ✓ $file" || echo "  ⚠ $file missing (optional)"
          done
          
          if [ $MISSING -eq 1 ]; then
            echo ""
            echo "❌ Some required files are missing!"
            exit 1
          else
            echo ""
            echo "✅ All required files present!"
          fi
      
      - name: Count total files
        run: |
          TOTAL_FILES=$(find . -type f -not -path "./.git/*" | wc -l)
          echo "Total files in repository: $TOTAL_FILES"
          echo "✅ Repository structure check complete"

  # Job 4: Final status
  final-status:
    name: Final Status
    runs-on: ubuntu-latest
    needs: [validate-configs, validate-scripts, check-files]
    if: always()
    
    steps:
      - name: Report status
        run: |
          echo "=========================================="
          echo "REPRODUCIBILITY PACKAGE VALIDATION"
          echo "=========================================="
          echo ""
          
          if [ "${{ needs.validate-configs.result }}" == "success" ]; then
            echo "✅ Configuration validation: PASSED"
          else
            echo "❌ Configuration validation: FAILED"
          fi
          
          if [ "${{ needs.validate-scripts.result }}" == "success" ]; then
            echo "✅ Script validation: PASSED"
          else
            echo "❌ Script validation: FAILED"
          fi
          
          if [ "${{ needs.check-files.result }}" == "success" ]; then
            echo "✅ File completeness: PASSED"
          else
            echo "❌ File completeness: FAILED"
          fi
          
          echo ""
          echo "=========================================="
          
          if [ "${{ needs.validate-configs.result }}" == "success" ] && \
             [ "${{ needs.validate-scripts.result }}" == "success" ] && \
             [ "${{ needs.check-files.result }}" == "success" ]; then
            echo "✅ ALL CHECKS PASSED!"
            echo "Your reproducibility package is ready for use."
            exit 0
          else
            echo "❌ SOME CHECKS FAILED"
            echo "Please review the logs above."
            exit 1
          fi
